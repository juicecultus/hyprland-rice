# hypridle — idle -> lock -> screen off.  NO suspend (broken on this Mac).
# Lid close is handled by logind (poweroff). Brightness is owned by the
# ALS auto-brightness service, so we don't dim here (avoids fighting it).

general {
    lock_cmd = pidof hyprlock || hyprlock
    after_sleep_cmd = hyprctl dispatch dpms on
    ignore_dbus_inhibit = false
}

# Lock after 10 minutes idle
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# Turn the panel off shortly after locking
listener {
    timeout = 660
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
