# hyprlock — Tokyo Night lock screen
general {
    hide_cursor = true
    grace = 2
    ignore_empty_input = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.9
    brightness = 0.7
    color = rgba(1a1b26ff)
}

# Big clock
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(c0caf5ff)
    font_size = 150
    font_family = CaskaydiaCove Nerd Font
    position = 0, 290
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %d %B')"
    color = rgba(7aa2f7ff)
    font_size = 30
    font_family = CaskaydiaCove Nerd Font
    position = 0, 160
    halign = center
    valign = center
}

# User avatar circle (initial)
label {
    monitor =
    text =
    color = rgba(bb9af7ff)
    font_size = 66
    position = 0, 40
    halign = center
    valign = center
}

# Password input
input-field {
    monitor =
    size = 440, 70
    outline_thickness = 3
    dots_size = 0.30
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgba(7aa2f7ff)
    inner_color = rgba(16161eff)
    font_color = rgba(c0caf5ff)
    fade_on_empty = false
    placeholder_text = <span foreground="##565f89">  Enter password</span>
    check_color = rgba(9ece6aff)
    fail_color = rgba(f7768eff)
    fail_text = <span foreground="##f7768e">Wrong</span>
    position = 0, -90
    halign = center
    valign = center
}
