# ============================================================
#  Hyprland — Omarchy-style rice (Tokyo Night)
#  MacBook10,1 (2304x1440 retina, applespi kb/touchpad)
# ============================================================

### MONITOR ###################################################
# Internal retina panel scaled to ~1.5x for sane UI sizes
monitor = eDP-1, preferred, auto, 2
monitor = , preferred, auto, 2              # any external -> auto

### AUTOSTART #################################################
exec-once = wpaperd -d
exec-once = waybar
exec-once = swaync
exec-once = hypridle
exec-once = systemctl --user start hyprpolkitagent
exec-once = wl-paste --type text  --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
# keep the silent ALS auto-brightness service (system-level) running

### ENV / HIDPI ##############################################
env = XDG_CURRENT_DESKTOP,Hyprland
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = XCURSOR_THEME,capitaine-cursors
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = GDK_BACKEND,wayland,x11
env = MOZ_ENABLE_WAYLAND,1
env = ELECTRON_OZONE_PLATFORM_HINT,wayland
env = CLAUDE_USE_WAYLAND,1               # claude-desktop: native Wayland (crisp HiDPI)
env = _JAVA_AWT_WM_NONREPARENTING,1

### PALETTE (swapped by theme-toggle) #######################
source = ~/.config/hypr/colors.conf

### LOOK & FEEL #############################################
general {
    gaps_in = 5
    gaps_out = 12
    border_size = 2
    col.active_border = $blue $purple 45deg
    col.inactive_border = $inactive
    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 12
    active_opacity = 1.0
    inactive_opacity = 0.96
    shadow {
        enabled = true
        range = 18
        render_power = 3
        color = rgba(0b0b14cc)
    }
    blur {
        enabled = true
        size = 6
        passes = 3
        new_optimizations = true
        ignore_opacity = true
        xray = false
        vibrancy = 0.1696
    }
}

animations {
    enabled = true
    bezier = omarchy, 0.05, 0.9, 0.1, 1.0
    bezier = overshot, 0.13, 0.99, 0.29, 1.1
    animation = windows, 1, 5, overshot, slide
    animation = windowsOut, 1, 4, omarchy, slide
    animation = border, 1, 8, default
    animation = fade, 1, 6, omarchy
    animation = workspaces, 1, 5, omarchy, slidefade 15%
    animation = layers, 1, 4, omarchy, fade
}

dwindle {
    preserve_split = true
}

master {
    new_status = master
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    focus_on_activate = true
}

### INPUT ###################################################
input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = true
        tap-to-click = true
        disable_while_typing = true
        clickfinger_behavior = true
        scroll_factor = 0.5
    }
}

# 3-finger horizontal swipe to switch workspaces (new 0.55 syntax)
gesture = 3, horizontal, workspace

### KEYBINDINGS #############################################
$mod = SUPER
$term = alacritty
$menu = wofi --show drun
$filemgr = thunar

# core
bind = $mod, RETURN, exec, $term
bind = $mod, Q, killactive,
bind = $mod, E, exec, $filemgr
bind = $mod, SPACE, exec, $menu
bind = $mod, B, exec, firefox
bind = $mod, M, exec, alacritty --class btop-float -e btop
bind = $mod, A, exec, alacritty --class cava-float -e cava
bind = $mod, F, fullscreen, 0
bind = $mod, V, togglefloating,
bind = $mod, T, layoutmsg, togglesplit
bind = $mod, P, pseudo,
bind = $mod, L, exec, hyprlock
bind = $mod, slash, exec, ~/.local/bin/keybinds   # keybind cheatsheet
bind = $mod SHIFT, Q, exit,

# clipboard history (wofi)
bind = $mod, C, exec, cliphist list | wofi --dmenu | cliphist decode | wl-copy

# notification control center (swaync)
bind = $mod, N, exec, swaync-client -t -sw
bind = $mod SHIFT, N, exec, swaync-client -d -sw   # toggle do-not-disturb

# focus (vim + arrows)
bind = $mod, left,  movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up,    movefocus, u
bind = $mod, down,  movefocus, d
bind = $mod, h, movefocus, l
bind = $mod, l, movefocus, r
bind = $mod, k, movefocus, u
bind = $mod, j, movefocus, d

# move windows
bind = $mod SHIFT, left,  movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up,    movewindow, u
bind = $mod SHIFT, down,  movewindow, d

# workspaces
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up,   workspace, e-1

# mouse drag
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# theme toggle (Tokyo Night <-> Catppuccin)
bind = $mod SHIFT, T, exec, ~/.local/bin/theme-toggle

# screenshots (grim + slurp)
bind = , Print, exec, grim - | wl-copy
bind = $mod SHIFT, S, exec, grim -g "$(slurp)" - | wl-copy
bind = $mod SHIFT, P, exec, grim -g "$(slurp)" ~/Pictures/shot-$(date +%s).png
# annotate a region with satty (arrows, text, blur) -> clipboard + saved file
bind = $mod SHIFT, A, exec, grim -g "$(slurp)" - | satty --filename - --output-filename ~/Pictures/shot-%Y%m%d-%H%M%S.png --early-exit --copy-command wl-copy --initial-tool brush

# color picker (hyprpicker) -> hex to clipboard
bind = $mod SHIFT, C, exec, hyprpicker -a && notify-send "Color picked" "$(wl-paste)"

# media / brightness keys
bindel = , XF86AudioRaiseVolume, exec, ~/.local/bin/volume-ctl up
bindel = , XF86AudioLowerVolume, exec, ~/.local/bin/volume-ctl down
bindl  = , XF86AudioMute,        exec, ~/.local/bin/volume-ctl mute
bindl  = , XF86AudioMicMute,     exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp,   exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
bindl  = , XF86AudioPlay,  exec, playerctl play-pause
bindl  = , XF86AudioNext,  exec, playerctl next
bindl  = , XF86AudioPrev,  exec, playerctl previous

### WINDOW RULES ###########################################
# Hyprland 0.55 syntax: "<effect> <value>, match:<prop> <regex>"
windowrule = suppress_event maximize, match:class .*
windowrule = float true, match:class pavucontrol
windowrule = float true, match:class nm-connection-editor
windowrule = float true, match:title ^(Open File).*$
windowrule = float true, match:title ^(Save File).*$
windowrule = opacity 0.95, match:class thunar
# floating btop monitor (Super+M)
windowrule = float true, match:class btop-float
windowrule = size 980 600, match:class btop-float
windowrule = center true, match:class btop-float
# floating cava audio visualizer (Super+A)
windowrule = float true, match:class cava-float
windowrule = size 980 420, match:class cava-float
windowrule = center true, match:class cava-float
# satty annotation editor floats
windowrule = float true, match:class com.gabm.satty
