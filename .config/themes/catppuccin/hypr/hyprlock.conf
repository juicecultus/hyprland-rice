# hyprlock — Tokyo Night lock screen
general {
    hide_cursor = true
    grace = 2
    ignore_empty_input = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.9
    brightness = 0.7
    color = rgba(1e1e2eff)
}

# Big clock
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(cdd6f4ff)
    font_size = 110
    font_family = CaskaydiaCove Nerd Font
    position = 0, 220
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %d %B')"
    color = rgba(89b4faff)
    font_size = 22
    font_family = CaskaydiaCove Nerd Font
    position = 0, 120
    halign = center
    valign = center
}

# User avatar circle (initial)
label {
    monitor =
    text =
    color = rgba(cba6f7ff)
    font_size = 48
    position = 0, 20
    halign = center
    valign = center
}

# Password input
input-field {
    monitor =
    size = 320, 52
    outline_thickness = 2
    dots_size = 0.28
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgba(89b4faff)
    inner_color = rgba(181825ff)
    font_color = rgba(cdd6f4ff)
    fade_on_empty = false
    placeholder_text = <span foreground="##6c7086">  Enter password</span>
    check_color = rgba(a6e3a1ff)
    fail_color = rgba(f38ba8ff)
    fail_text = <span foreground="##f38ba8">Wrong</span>
    position = 0, -60
    halign = center
    valign = center
}
