# Alacritty — Tokyo Night (Omarchy-style)
[window]
padding = { x = 14, y = 14 }
decorations = "none"
opacity = 0.95
dynamic_padding = true

[font]
size = 11.0
normal = { family = "CaskaydiaCove Nerd Font Mono", style = "Regular" }
bold   = { family = "CaskaydiaCove Nerd Font Mono", style = "Bold" }
italic = { family = "CaskaydiaCove Nerd Font Mono", style = "Italic" }

[cursor]
style = { shape = "Block", blinking = "On" }

# ---- Tokyo Night colors ----
[colors.primary]
background = "#1e1e2e"
foreground = "#cdd6f4"

[colors.normal]
black   = "#11111b"
red     = "#f38ba8"
green   = "#a6e3a1"
yellow  = "#f9e2af"
blue    = "#89b4fa"
magenta = "#cba6f7"
cyan    = "#89dceb"
white   = "#bac2de"

[colors.bright]
black   = "#585b70"
red     = "#f38ba8"
green   = "#a6e3a1"
yellow  = "#f9e2af"
blue    = "#89b4fa"
magenta = "#cba6f7"
cyan    = "#89dceb"
white   = "#cdd6f4"

[colors.selection]
background = "#45475a"
foreground = "#cdd6f4"
